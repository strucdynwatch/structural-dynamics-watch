# Builds the site and publishes it to GitHub Pages.
# Runs on every push to main, every night at 05:17 UTC, and on demand (Actions tab, "Run workflow").
name: Build and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm install
      - run: npm run build
        env:
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
      - name: Check Home link on every page
        run: |
          for f in dist/*.html; do
            echo "$f -> $(grep -o '<a href=[^>]*font-weight:600[^>]*>' "$f" || echo MISSING)"
          done
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
